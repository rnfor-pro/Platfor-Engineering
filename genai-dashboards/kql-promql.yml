## Things to verify before trusting these queries in production

1. **Metric type mismatch** — if your Collector exports gauges instead of counters/histograms for any `gen_ai.*` metric, swap `increase()`/`rate()` for direct value reads, and `histogram_quantile()` won't work at all.
2. **Label cardinality** — if `gen_ai.request.model` or similar attributes were accidentally left as high-cardinality (e.g. including a request ID), Prometheus/VictoriaMetrics will struggle. Check cardinality with `count(count by (gen_ai_request_model) (gen_ai_client_operation_duration_seconds_count))` — should be a small, stable number (one per model), not thousands.
3. **Counter resets** — `increase()` handles counter resets (e.g. service restarts) automatically, but only within the queried range; very short ranges right after a restart can under-report.
4. **Loki label vs. parsed field** — `service_name` works as a **label** filter (`{service_name=~"..."}`) only if your Collector's Loki exporter promotes it to a label. If it's only inside the JSON log body, you'll need `| json | service_name=~"..."` instead — check your Loki exporter's `labels` config.