## Quick syntax cheat sheet

| Concept | KQL | PromQL | LogQL | TraceQL |
|---|---|---|---|---|
| Filter by label/field | `where x == "y"` | `{label="y"}` | `{label="y"}` | `{ span.attr = "y" }` |
| Regex filter | `where x matches regex "y.*"` | `{label=~"y.*"}` | `{label=~"y.*"}` | `{ span.attr =~ "y.*" }` |
| Sum/aggregate | `summarize sum(value)` | `sum(metric)` | `sum(count_over_time({...}[5m]))` | n/a (use metrics-generator) |
| Group by | `summarize ... by field` | `sum by (label) (metric)` | `sum by (label) (...)` | n/a |
| Percentile | `percentile(value, 90)` | `histogram_quantile(0.90, ...)` | `quantile_over_time(0.90, ...)` | n/a |
| Time bucket | `bin(timestamp, 1h)` | `[1h]` range vector | `[1h]` range vector | n/a |
| Text search | `where message contains "x"` | n/a (metrics don't have free text) | `\|= "x"` | n/a |

