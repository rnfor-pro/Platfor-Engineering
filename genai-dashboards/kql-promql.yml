# KQL → PromQL / LogQL / TraceQL Migration Reference

Companion reference for `copilot-otel-dashboard.json`. Maps every panel back to the original Azure Monitor / Application Insights KQL query it replaces, plus the query language and naming conventions you need to know when adapting or troubleshooting panels.

---

## Naming convention translation

Application Insights stores OTel attributes as flattened `customDimensions` keys with dots intact (e.g. `customDimensions["gen_ai.request.model"]`). Prometheus/VictoriaMetrics cannot use dots in label or metric names, so the OTel Collector's `prometheusremotewrite` / native OTLP exporters convert them automatically:

| OTel attribute (dots) | Prometheus label/metric (underscores) |
|---|---|
| `gen_ai.request.model` | `gen_ai_request_model` |
| `gen_ai.usage.input_tokens` | `gen_ai_usage_input_tokens` (as a metric name, becomes `gen_ai_usage_input_tokens_total`) |
| `gen_ai.operation.name` | `gen_ai_operation_name` |
| `service.name` | `service_name` |
| `error.type` | `error_type` |

Loki and Tempo preserve dotted attribute names natively (as log labels / span attributes respectively), so no translation is needed for those two.

